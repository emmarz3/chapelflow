<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4d277b" />
    <meta
      name="description"
      content="ChapelFlow — the digital chapel platform for Chrisland University Chapel, Abeokuta."
    />
    <link rel="preload" as="image" href="/chapelflow-brand.jpg" />
    <link rel="preload" as="image" href="/chrisland-university-chapel.png" />
    <style>
      html.cf-intro-pending body { background: #fff; }
      html.cf-intro-pending #root { visibility: hidden; }
    </style>
    <script>
      (() => {
        try {
          const privateEntry = ["/app", "/kiosk", "/usher"].some((prefix) =>
            window.location.pathname.startsWith(prefix),
          );
          const shouldReplayHome = window.location.pathname === "/";
          if (
            !privateEntry &&
            (shouldReplayHome || sessionStorage.getItem("chapelflow:intro-seen") !== "1")
          ) {
            document.documentElement.classList.add("cf-intro-pending");
            window.setTimeout(
              () => document.documentElement.classList.remove("cf-intro-pending"),
              3000,
            );
          }
        } catch {
          document.documentElement.classList.remove("cf-intro-pending");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <title>ChapelFlow | Chrisland University Chapel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
