[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The Django backend (chapelflow-backend/) is deployed on Render, not Netlify, and
  # e2e/ only holds Playwright fixtures — neither ships in the static build output.
  SECRETS_SCAN_OMIT_PATHS = "chapelflow-backend/**,e2e/**"
  # Plain configuration values (e.g. "local", "ChapelFlow", port numbers, booleans)
  # that naturally appear throughout the source and are not secrets.
  SECRETS_SCAN_OMIT_KEYS = "ACCESS_TOKEN_LIFETIME_MIN,ALLOWED_HOSTS,ALLOWED_UPLOAD_EXTENSIONS,ATTENDANCE_DUPLICATE_WINDOW_MIN,CORS_ALLOWED_ORIGINS,CSRF_TRUSTED_ORIGINS,DEBUG,DEFAULT_FROM_EMAIL,EMAIL_PORT,EMAIL_USE_TLS,FRONTEND_URL,MATRIC_NUMBER_REGEX,MAX_UPLOAD_SIZE_MB,MFA_ENFORCED_ROLES,MFA_ENFORCE_ROLE_OBJECTS,PAYSTACK_CALLBACK_URL,QR_TOKEN_TTL_HOURS,REFRESH_TOKEN_LIFETIME_DAYS,SMS_PROVIDER,SMS_SENDER_ID,STORAGE_PROVIDER,SUPABASE_STORAGE_BUCKET,SUPER_ADMIN_FIRST_NAME,SUPER_ADMIN_LAST_NAME,TIME_ZONE"

# Proxy API calls to the Django backend on Render (mirrors vercel.json).
[[redirects]]
  from = "/api/*"
  to = "https://chapelflow-api-yhqr.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routing fallback for the React SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/auth-videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
