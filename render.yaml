# ChapelFlow free-tier deployment on Render.
# Repository layout:
#   ./render.yaml
#   ./chapelflow-backend/Dockerfile
#   React frontend at the repository root (not configured as a Render service here).
#
# This Blueprint deploys the Django API, Render Key Value, and Render Postgres.
# Celery worker and Celery Beat services are intentionally omitted because
# Render does not offer free background-worker instances.

services:
  # Django REST API
  - type: web
    name: chapelflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./chapelflow-backend/Dockerfile
    dockerContext: ./chapelflow-backend
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chapelflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chapelflow-redis
          property: connectionString
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: chapelflow-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: chapelflow-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: chapelflow-uploads

  # Redis-compatible Key Value datastore.
  # An empty IP allow list blocks public access; Render services can use
  # the internal connection URL when they are in the same region.
  - type: keyvalue
    name: chapelflow-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: chapelflow-db
    plan: free
    databaseName: chapelflow
    user: chapelflow
